<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Abstract package seal inspection illustration</title>
  <desc id="desc">A horizontal package outline with the right seal region highlighted for inspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071523"/>
      <stop offset="0.55" stop-color="#102943"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="pack" x1="220" y1="180" x2="980" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9C8D4" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7FDCEB" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#59CFE8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

